<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vgBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1E26"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
    <mask id="vgCutMask">
      <rect width="100" height="100" fill="white"/>
      <polygon points="36,44 49,33.5 52.8,37 39.8,47.5" fill="black"/>
    </mask>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .vg-letters {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 47.5px;
        font-weight: 800;
        fill: #FFFFFF;
        text-anchor: middle;
        letter-spacing: -1.2px;
      }
    </style>
  </defs>

  <!-- Fundo Squircle / Grafite Chumbo Escuro -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="20" fill="url(#vgBgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2"/>

  <!-- Letras VG com o corte refinado fiel à imagem -->
  <text x="50" y="66" class="vg-letters" mask="url(#vgCutMask)">VG</text>
</svg>
